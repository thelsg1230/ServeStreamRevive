apply plugin: 'com.android.application'

// Version 2.X.Y from N, the number of changes made since this project was
// revived (commits after d82c2c9, the last commit before the revival work):
// X = N / 10, Y = N % 10  (e.g. 36 changes -> 2.3.6, 120 -> 2.12.0).
def revisionCount = { ->
    try {
        def p = ['git', 'rev-list', '--count', 'd82c2c9..HEAD'].execute(null, rootDir)
        p.waitFor()
        def out = p.text.trim()
        return (p.exitValue() == 0 && out) ? out.toInteger() : 0
    } catch (ignored) {
        return 0
    }
}()
def appVersion = "2.${revisionCount.intdiv(10)}.${revisionCount % 10}"

android {
    namespace 'net.sourceforge.servestream'
    compileSdk 36
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId "net.sourceforge.servestream"
        minSdk 21
        targetSdk 36
        versionName appVersion
        versionCode 200 + revisionCount
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    base {
        archivesName = "ServeStream-${appVersion}"
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        disable 'MissingTranslation', 'ExtraTranslation'
    }

    signingConfigs {
        // fixed key so new builds install as updates over older ones
        stable {
            storeFile file('servestream-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
            // non-debuggable build: ART CheckJNI stays off, like the original release APK
            debuggable false
            jniDebuggable false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }

    sourceSets.main {
        jniLibs.srcDirs = ['src/main/libs']
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

def ndkDir = android.ndkDirectory

tasks.register('buildFFmpeg', Exec) {
    description = 'Compile FFmpeg and OpenSSL via NDK'
    commandLine 'bash', file('src/main/ffmpeg/build_ffmpeg_modern.sh').absolutePath,
            ndkDir.absolutePath, 'arm64-v8a', 'armeabi-v7a', 'x86_64'
}

tasks.register('buildNative', Exec) {
    description = 'Compile JNI source via NDK'
    dependsOn 'buildFFmpeg'
    commandLine "$ndkDir/ndk-build",
            'NDK_APPLICATION_MK=Application.mk',
            '-C', file('src/main/jni').absolutePath,
            '-j', Runtime.runtime.availableProcessors(),
            'all',
            'NDK_DEBUG=0'
}

tasks.register('cleanNative', Exec) {
    description = 'Clean JNI object files'
    commandLine "$ndkDir/ndk-build", '-C', file('src/main/jni').absolutePath, 'clean'
}

tasks.named('preBuild') { dependsOn 'buildNative' }
tasks.named('clean') { dependsOn 'cleanNative' }

dependencies {
    implementation files('libs/jplaylistparser-0.2.5.jar')
    implementation files('libs/jsoup-1.8.1.jar')
    implementation project(':dslv')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.loader:loader:1.1.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.media:media:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    // emulator test of the Android Auto connection
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'junit:junit:4.13.2'
}

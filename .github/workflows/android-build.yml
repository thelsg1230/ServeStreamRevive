name: ServeStream Android Build

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          elif [ -x "$SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then
            echo "$SDK_ROOT/cmdline-tools/bin" >> "$GITHUB_PATH"
          else
            echo "sdkmanager was not found in $SDK_ROOT"
            find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

      - name: Accept SDK licenses and install packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platforms;android-27" \
            "build-tools;28.0.3" \
            "ndk;20.0.5594570"

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ServeStream-debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
```
